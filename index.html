<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><title>ROBI</title><script>(function(){try{var o=localStorage.getItem("robi_theme");var h=new Date().getHours();var t="night";document.documentElement.setAttribute("data-theme",t);}catch(e){document.documentElement.setAttribute("data-theme","night");}})();</script>
</head><body>
<style>
/* =========================================================================
   ROBI — style « Proxy » : cartes pleines sur fond sombre, typo en clair,
   accent violet, gros chiffres lisibles. Fini le verre et les majuscules mono.
   ========================================================================= */

:root{
  --ground:#C7D2E0;                /* fond : dégradé lavande vers menthe (voir body) */
  --panel:rgba(255,255,255,.52);   /* cartes en verre dépoli clair */
  --panel-2:rgba(255,255,255,.78); /* survol / carte en avant */
  --modal-bg:rgba(255,255,255,.96); /* fenêtres qui s'ouvrent : presque opaques, on ne voit plus au travers */
  --panel-3:rgba(58,64,90,.06);    /* creux : pistes, champs */
  --brd:rgba(58,64,90,.13);
  --brd-hi:rgba(58,64,90,.26);
  --track:rgba(58,64,90,.12);
  --blur:blur(26px) saturate(1.4);
  --inset:inset 0 1px 0 rgba(255,255,255,.6);
  --shadow:0 18px 44px -26px rgba(60,70,110,.32);
  --shadow-lg:0 34px 74px -30px rgba(60,70,110,.4);

  --txt:#2B2F3D;             /* anthracite bleute, sur verre clair */
  --dim:#5E6472;             /* texte secondaire */
  --dim2:#9298A6;            /* micro-labels, hints */

  /* Capacites : une couleur par capacite, la meme partout */
  --c-physique:#3AC2FF; --c-mental:#9A6CFF; --c-creativite:#FF6FC7;
  --c-business:#FFCF4D; --c-social:#3FE6A3; --c-discipline:#FF8A4D;

  /* Accent : anthracite profond, comme les boutons sombres de la référence */
  --accent:#2E3444; --accent-2:#4A5266; --accent-deep:#1D222E;
  --violet:#7C83D6; --blue:#4DB8FF; --cyan:#8FE6FF;
  --pink:#FF6B8A; --gold:#E0A94D; --mint:#3FC9A0; --red:#E05264;
  --cyan-b:var(--blue); --line-soft:var(--brd); --amber:var(--gold); --font-sys:var(--mono);

  --font:ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",sans-serif;
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
  --r-card:16px; --r-md:12px; --r-sm:9px; --r-pill:999px;
  --rail:186px;
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{height:100%}
body{
  margin:0;height:100dvh;overflow:hidden;color:var(--txt);
  font-family:var(--font);font-size:14.5px;line-height:1.5;-webkit-font-smoothing:antialiased;
  background:linear-gradient(135deg,#CBCFEE 0%,#CAD3EC 32%,#C6DEDB 66%,#C2E3D0 100%);
  background-attachment:fixed;
}

/* ---------- Coque ---------- */
#app{max-width:1560px;margin:0 auto;height:100dvh;display:flex;flex-direction:column;
  padding:calc(20px + env(safe-area-inset-top,0px)) calc(30px + env(safe-area-inset-right,0px)) 0 calc(30px + env(safe-area-inset-left,0px))}
#view{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;padding-bottom:34px;scrollbar-width:thin}
#view::-webkit-scrollbar{width:9px}
#view::-webkit-scrollbar-thumb{background:rgba(58,64,90,.26);border-radius:99px}
.view-anim{animation:viewIn .3s cubic-bezier(.2,.7,.2,1) both}
@keyframes viewIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* ---------- Barre du haut ---------- */
.topbar{display:flex;align-items:center;gap:16px;margin-bottom:20px;flex:none}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.mark{position:relative;width:44px;height:44px;border-radius:13px;flex:none;display:grid;place-items:center;
  background:linear-gradient(150deg,var(--accent),var(--accent-deep));overflow:hidden}
.mark svg{width:31px;height:31px}
.brand h1{font-size:17px;font-weight:600;letter-spacing:-.01em;margin:0;color:var(--txt)}
.brand small{display:block;font-size:11.5px;color:var(--dim2);margin-top:1px}
.hud-status{display:flex;align-items:center;gap:7px;font-family:var(--mono);font-size:11px;letter-spacing:.06em;color:var(--dim2);margin-left:auto}
.hud-status .dot{width:6px;height:6px;border-radius:50%;background:var(--mint);box-shadow:0 0 9px var(--mint);animation:blink 2.6s ease-in-out infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}
.tools{display:flex;gap:9px;flex:none}
.icobtn{position:relative;overflow:hidden;width:40px;height:40px;border-radius:12px;display:grid;place-items:center;
  background:var(--panel);border:1px solid var(--brd);color:var(--dim);cursor:pointer;font-size:15px;transition:.16s}
.icobtn:hover{color:var(--txt);border-color:var(--brd-hi);background:var(--panel-2)}
.ubadge{position:absolute;top:-3px;right:-3px;width:9px;height:9px;border-radius:50%;background:var(--red);box-shadow:0 0 9px var(--red)}

/* ---------- Rail lateral ---------- */
nav{flex:none;display:flex;flex-direction:row;gap:8px;margin-bottom:22px;padding:8px;
  overflow-x:auto;overflow-y:hidden;scrollbar-width:none;
  background:var(--panel);border:1px solid var(--brd);border-radius:var(--r-pill);
  -webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur)}
nav::-webkit-scrollbar{height:0}
nav button{position:relative;overflow:hidden;background:none;border:0;color:var(--dim);cursor:pointer;
  padding:13px 18px;border-radius:var(--r-pill);font-family:var(--font);font-size:16px;font-weight:600;
  display:flex;align-items:center;justify-content:center;gap:11px;white-space:nowrap;flex:1 1 0;min-width:max-content;transition:.16s}
nav button .ni{font-size:22px;line-height:1;flex:none}
nav button .nl{flex:none}
nav button .nlv{font-family:var(--mono);font-size:11.5px;color:var(--dim2);flex:none;display:flex;align-items:center;gap:5px}
nav button .nlv b{font-weight:600;font-size:14px;color:var(--dim2)}
nav button:hover{background:var(--panel-2);color:var(--txt)}
nav button.on{background:linear-gradient(140deg,var(--accent),var(--accent-deep));color:#fff;box-shadow:0 6px 16px -8px var(--accent-deep)}
nav button.on .nl{color:#fff}
nav button.on .nlv,nav button.on .nlv b{color:rgba(255,255,255,.85)}
nav button.capnav .ni{filter:drop-shadow(0 0 6px var(--cc))}
nav button.capnav.wk .nlv b{color:var(--cc)}
nav button.capnav.on .ni{filter:none}

/* ---------- Cartes ---------- */
.spanel,.win,.askwin,.modalwin,.flashwin,.secretwin,.bootwin,.propcard,.pcard,.kpi,.dcard,.absrow,.objrow,.sysrow{
  background:var(--panel);border:1px solid var(--brd);box-shadow:var(--shadow),var(--inset);
  -webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur)}
.spanel,.win{position:relative;border-radius:var(--r-card);padding:20px}
.win{margin:0}
.win-h{display:flex;align-items:center;gap:11px;margin-bottom:14px}
.win-h .t{font-size:15px;font-weight:600;color:var(--txt)}
.win-h .ln{flex:1;height:1px;background:var(--brd)}
.win-h .r{font-family:var(--mono);font-size:11px;color:var(--dim2)}
.spl{font-size:15px;font-weight:600;color:var(--txt);margin-bottom:15px;display:flex;gap:10px;align-items:center}
.spl .capgo{margin-left:auto}
.plab{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim2);margin-bottom:9px}
.subhead{font-size:13.5px;line-height:1.6;color:var(--dim)}
.empty{font-size:13.5px;color:var(--dim2);padding:12px 0}
.mtag{font-family:var(--mono);font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--accent-2);margin-bottom:9px}
.mtitle{font-size:20px;font-weight:600;line-height:1.25;color:var(--txt)}
.iri{position:relative}
.forgecit{position:relative;padding:6px 2px 2px 4px}
.forgecit .fq{position:absolute;top:-20px;left:-6px;font-size:64px;line-height:1;color:var(--c-physique);opacity:.32;font-family:Georgia,"Times New Roman",serif;pointer-events:none}
.forgecit .ft{position:relative;font-size:16px;line-height:1.62;font-style:italic;color:var(--txt);text-wrap:pretty}
.forgecit .fa{margin-top:13px;font-family:var(--mono);font-size:11px;letter-spacing:.04em;color:var(--dim2)}

/* ---------- Le systeme ---------- */
.solo{display:flex;flex-direction:column;gap:16px;padding:2px 0 22px}
.solo .tbar{display:flex;align-items:baseline;gap:13px;flex-wrap:wrap;margin-bottom:2px}
.solo .tbar .tt{font-size:27px;font-weight:700;letter-spacing:-.02em;color:var(--txt)}
.solo .tbar small{font-size:13.5px;color:var(--dim);font-weight:400}
.solo .tbar .addbtn{margin-left:auto;padding:10px 17px;font-size:13.5px;flex:none}
/* Les chiffres, en petit sous le profil du Cockpit */
.dgrid.mini{grid-template-columns:repeat(3,1fr);gap:11px;margin-top:0}
.dgrid.mini .dcard{padding:14px 12px}
.dgrid.mini .di{width:30px;height:30px;font-size:14px;margin-bottom:10px}
.dgrid.mini b{font-size:24px}
.dgrid.mini .dl{font-size:12.5px;margin-top:7px}
.dgrid.mini .ds{font-size:11px}
.cockbody{display:flex;flex-direction:column;gap:16px}

/* Bandeau (Proxy : la prochaine chose a faire) */
.mbanner{display:flex;align-items:center;gap:15px;padding:17px 20px;border-radius:var(--r-card);
  background:var(--panel);border:1px solid var(--brd);box-shadow:var(--shadow)}
.mbanner .bmk{width:42px;height:42px;border-radius:12px;flex:none;display:grid;place-items:center;font-size:19px;
  background:var(--panel-3);border:1px solid var(--brd)}
.mbanner .bbody{flex:1;min-width:0}
.mbanner .bbig{font-size:15px;font-weight:600;color:var(--txt)}
.mbanner .bsub{font-size:12.5px;color:var(--dim);margin-top:3px}

/* Rangee de chiffres (Proxy : les 4 cartes stat) */
.dgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.dcard{padding:18px;border-radius:var(--r-card);cursor:default}
.dcard.link{cursor:pointer;transition:.16s}
.dcard.link:hover{border-color:var(--dc);background:var(--panel-2)}
.dcard .di{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;font-size:16px;margin-bottom:14px;
  background:color-mix(in srgb,var(--dc) 20%,var(--panel-3));color:var(--dc)}
.dcard b{display:block;font-size:32px;font-weight:700;line-height:1;color:var(--txt);letter-spacing:-.02em}
.dcard .dl{font-size:13.5px;font-weight:500;color:var(--txt);margin-top:9px}
.dcard .ds{font-size:12px;color:var(--dim2);margin-top:3px}

/* Cockpit : deux colonnes */
.ckgrid{display:grid;grid-template-columns:minmax(300px,360px) minmax(0,1fr) minmax(280px,360px);gap:16px;align-items:start}
.ckcol{display:flex;flex-direction:column;gap:16px;min-width:0}
.wkhead{cursor:pointer;user-select:none}
.wkhead:hover .wkchev{color:var(--txt)}
.wkchev{color:var(--dim2);font-size:12px;margin-left:8px}
.habtabs{display:flex;gap:6px;margin:2px 0 12px;background:var(--panel-3);border-radius:12px;padding:4px}
.habtab{flex:1 1 0;display:flex;align-items:center;justify-content:center;gap:6px;padding:8px 6px;border:none;background:transparent;color:var(--dim);font-size:13px;font-weight:600;border-radius:9px;cursor:pointer;transition:.14s}
.habtab .hti{font-size:14px}
.habtab .htn{font-family:var(--mono);font-size:10px;background:var(--brd);color:var(--txt);border-radius:20px;padding:1px 6px}
.habtab:hover{color:var(--txt)}
.habtab.on{background:var(--panel-2);color:var(--txt);box-shadow:var(--inset)}
.habtab.on .htn{background:var(--accent);color:#fff}

/* Profil */
.srank{display:flex;align-items:center;gap:15px}
.rbig{font-family:var(--mono);font-weight:700;font-size:42px;line-height:.9}
.srank .rt{flex:1;min-width:0}
.srank .who{font-size:13px;color:var(--dim);margin:0 0 10px;font-weight:500}
.srank .rl{font-family:var(--mono);font-size:11px;color:var(--dim2)}
.sxp{display:flex;justify-content:space-between;font-family:var(--mono);font-size:11px;color:var(--dim);margin-bottom:7px}
.sxp span:last-child{color:var(--txt)}
.sbar,.bar,.tr,.pcbar,.obar,.tgprog{height:7px;border-radius:5px;background:var(--track);overflow:hidden}
.sbar i,.bar i,.tr i,.pcbar i,.obar i,.tgprog i{display:block;height:100%;border-radius:5px;transform-origin:left;transition:transform .55s cubic-bezier(.2,.7,.2,1)}
.sbar i{background:linear-gradient(90deg,var(--accent),var(--accent-2))}
.bar i{background:linear-gradient(90deg,var(--accent),var(--accent-2))}
.companion{cursor:pointer;transition:transform .2s}
.companion.pet{animation:pet .5s ease}
@keyframes pet{0%,100%{transform:none}35%{transform:scale(1.09) rotate(-4deg)}}

/* Citation */
.svoice{font-size:14.5px;line-height:1.62;color:var(--txt);border-left:3px solid var(--accent);padding:2px 0 2px 15px}
.svoice b{display:block;font-family:var(--mono);font-size:10px;letter-spacing:.14em;color:var(--accent-2);margin-bottom:9px;text-transform:uppercase}

/* ---------- Lignes de tache ---------- */
.q{display:flex;align-items:center;gap:13px;padding:13px 4px 13px 14px;border-bottom:1px solid var(--track);
  border-left:3px solid var(--tc,transparent);transition:background .14s}
.q:last-child{border-bottom:0}
.q:hover{background:var(--panel-2)}
.q.done{opacity:.42}
.q.off{opacity:.5}
.q .body{display:flex;align-items:center;gap:12px;flex-wrap:wrap;min-width:0;flex:1}
.q .ttl{flex:1;min-width:min(180px,100%);font-size:14.5px;line-height:1.35;color:var(--txt);overflow-wrap:anywhere}
.q.done .ttl{text-decoration:line-through;color:var(--dim2)}
.q .meta{display:flex;gap:7px;flex-wrap:wrap}
.q .xpv{font-family:var(--mono);font-size:11.5px;color:var(--accent-2);flex:none}
.check{width:24px;height:24px;border-radius:8px;flex:none;display:grid;place-items:center;font-size:12px;
  border:1.5px solid rgba(58,64,90,.3);color:transparent;cursor:pointer;transition:.16s}
.check:hover{border-color:var(--accent);color:rgba(58,64,90,.32)}
.q.done .check{background:linear-gradient(140deg,var(--accent),var(--accent-deep));border-color:transparent;color:#fff}
.check.off{cursor:default;border-style:dashed;color:var(--dim2)}
.substeps{display:flex;flex-direction:column;gap:2px;margin:-2px 0 8px 34px}
.subq{display:flex;align-items:center;gap:9px;padding:4px 6px}
.subcheck{width:18px;height:18px;border-radius:5px;flex:none;display:grid;place-items:center;font-size:11px;
  border:1.5px solid color-mix(in srgb,var(--tc,var(--accent)) 55%,transparent);color:transparent;cursor:pointer;transition:.16s}
.subcheck[data-subcheck]:hover{border-color:var(--tc,var(--accent))}
.subcheck.on{background:color-mix(in srgb,var(--tc,var(--accent)) 22%,transparent);border-color:var(--tc,var(--accent));color:var(--tc,var(--accent))}
.subttl{font-size:13px;color:var(--txt)}
.subttl.done{text-decoration:line-through;color:var(--dim2)}
.cksec{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--dim2);font-weight:700;margin:14px 2px 4px;padding-top:12px;border-top:1px solid var(--line-soft)}
.dpsub{margin:4px 0 8px}
.q.dropafter{box-shadow:0 3px 0 -1px var(--accent)}
.tag{font-family:var(--mono);font-size:9.5px;letter-spacing:.03em;padding:3px 9px;border-radius:7px;
  border:1px solid var(--brd);color:var(--dim);white-space:nowrap}
.deptag{color:var(--gold);border-color:rgba(255,207,111,.4)}
/* La liste du jour se repartit en colonnes selon la largeur : plus de grand
   vide au milieu de chaque ligne quand le titre est court. */
.tcols{columns:400px;column-gap:30px}
.tcols>.q{break-inside:avoid}
.q .edt,.q .mv,.q .del,.q .gear,.q .lock{color:var(--dim2);cursor:pointer;font-size:15px;padding:3px 5px;flex:none;transition:.14s}
.q .edt:hover,.q .mv:hover,.q .gear:hover,.q .lock:hover{color:var(--accent-2)}
.q .gear{font-size:16px;padding:4px 7px;border-radius:8px}
.q .gear:hover{background:var(--panel-3)}
.q .del:hover{color:var(--pink)}
.q .lock.on{color:var(--gold)}
.q.blkrow{opacity:.6}
.q.sub{border-left-style:dotted}
.q.pubrow{border-left-color:var(--pink)}
.q.pubrow.late{background:rgba(255,80,105,.07)}
.udot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--red);margin-right:9px;
  vertical-align:1px;box-shadow:0 0 11px var(--red);animation:updulse 1.6s ease-in-out infinite}
@keyframes updulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.45;transform:scale(.8)}}

/* ---------- Projets ---------- */
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,250px),1fr));gap:13px}
.pcard{position:relative;cursor:pointer;padding:16px 16px 15px 18px;border-radius:14px;overflow:hidden;transition:transform .16s,border-color .16s,background .16s}
.pcard:after{content:"";position:absolute;top:0;bottom:0;left:0;width:3px;background:var(--pc)}
.pcard:hover{transform:translateY(-2px);border-color:var(--pc);background:var(--panel-2)}
.pch{display:flex;align-items:flex-start;gap:9px;margin-bottom:13px;padding-right:52px}
.pcn{font-size:14.5px;font-weight:600;line-height:1.3;color:var(--txt);flex:1;min-width:0}
.pcbar i{background:var(--pc)}
.pcf{display:flex;justify-content:space-between;gap:8px;margin-top:11px;font-family:var(--mono);font-size:10px;color:var(--dim)}
.pcf .nx{color:var(--gold)}
.pcgo,.pcgear{position:absolute;top:12px;color:var(--dim2);font-size:16px;line-height:1;padding:3px 6px;border-radius:8px;cursor:pointer;transition:.14s}
.pcgo{right:12px}
.pcgear{right:36px;font-size:13px}
.pcgo:hover,.pcgear:hover{color:var(--accent-2);background:var(--panel-3)}
.otag{font-family:var(--mono);font-size:11px;font-weight:700;flex:none;border:1px solid currentColor;border-radius:6px;padding:1px 6px;line-height:1.5}

/* Groupe de projet deplie */
.taskgroup{margin-bottom:15px}
.taskgroup:last-child{margin-bottom:0}
.tghead{display:flex;align-items:center;gap:11px;padding:11px 2px;cursor:pointer;border-bottom:1px solid var(--brd)}
.tgchev{color:var(--dim2);font-size:12px;width:12px;flex:none}
.tgtitle{font-size:14.5px;font-weight:600;color:var(--txt);flex:1;min-width:0}
.tgprog{width:74px;flex:none}
.tgcount{font-family:var(--mono);font-size:10.5px;color:var(--dim2);flex:none}
.tgopen{color:var(--dim2);font-size:15px;padding:2px 7px;border-radius:8px;flex:none;cursor:pointer;transition:.14s}
.tgopen:hover{color:var(--accent-2);background:var(--panel-3)}
.tgbody{padding-top:2px}
.objrow{display:flex;align-items:center;gap:11px;padding:13px 15px;border-radius:12px;cursor:pointer;margin-bottom:9px}
.oname{flex:1;min-width:0;font-weight:600}
.op{font-family:var(--mono);font-size:11px;color:var(--dim)}

/* ---------- Etat de la semaine ---------- */
.capstate{position:relative;text-align:center;padding:24px 20px 20px}
.capstate .capgo{position:absolute;top:16px;right:18px;cursor:pointer;font-size:15px;opacity:.6}
.capstate .capgo:hover{opacity:1}
.csbig{font-size:22px;font-weight:700;letter-spacing:-.01em;margin-bottom:6px}
.capstate.ok .csbig{color:var(--cc)}
.capstate.todo .csbig{color:var(--dim)}
.cssub{font-size:12.5px;color:var(--dim2);margin-bottom:16px}
.wkstrip{display:flex;gap:5px;margin:4px auto 12px;width:100%;max-width:540px}
.wkstrip i{flex:1;height:11px;border-radius:4px;background:var(--track);border:1px solid var(--brd)}
.wkstrip i.on{background:var(--cc);border-color:var(--cc);box-shadow:0 0 13px -3px var(--cc)}
.wkmsg{font-size:12.5px;color:var(--dim)}
.scap{display:flex;align-items:center;gap:11px;padding:9px 0}
.scap .n{font-size:14px;flex:none;width:120px}
.scap .lv{font-family:var(--mono);font-size:11px;color:var(--dim);flex:none}
.scap .capgo{cursor:pointer;font-size:14px;opacity:.6}
.capgoal,.capprev{margin-top:13px;padding:13px 15px;border-radius:12px;border:1px solid var(--brd);background:var(--panel-3)}
.capgoal.ok,.capprev.ok{border-color:rgba(75,227,164,.4)}
.capgoal.tight,.capprev.tight{border-color:rgba(255,207,111,.4)}
.capgoal.no,.capprev.no{border-color:rgba(255,80,105,.45)}
.cgl{display:flex;justify-content:space-between;gap:9px;font-family:var(--mono);font-size:10.5px;color:var(--dim);margin-bottom:8px}

/* ---------- Formulaires et boutons ---------- */

.calrange{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:12px;padding-top:12px;border-top:1px solid var(--brd)}

.calrange .cr-add{padding:9px 15px}
.calsum{margin-top:10px;font-size:12.5px;color:var(--dim);line-height:1.4}
.calsum b{color:var(--txt)}
.okrow{background:rgba(63,201,160,.14);border:1px solid rgba(63,201,160,.4);color:var(--txt);border-radius:10px;padding:9px 12px;font-size:12.5px;margin-bottom:10px;line-height:1.45}

.q.draggable{cursor:grab}

.nextcard{box-shadow:var(--shadow),var(--inset),inset 3px 0 0 var(--tc)}
.nextrow{display:flex;align-items:center;gap:12px;margin-top:2px}

.nextmeta{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.planopt{display:flex;align-items:center;gap:11px;padding:10px 11px;border:1px solid var(--brd);border-radius:12px;margin-bottom:8px;cursor:pointer;transition:.12s}

.planopt.on{border-color:var(--accent);background:var(--panel-3)}
.pkbox{width:24px;height:24px;border-radius:7px;border:1.5px solid var(--brd-hi);display:flex;align-items:center;justify-content:center;color:#fff;flex:none;font-size:13px;font-weight:700}

.pactelist{display:flex;flex-direction:column;gap:6px}
.pacterow{display:flex;align-items:center;gap:9px;padding:8px 10px;border-radius:10px;background:var(--panel-3);border-left:2px solid var(--gold)}
.pacterow .pttl{flex:1;min-width:0;font-size:14px;color:var(--txt)}
.pacterow .pstar{font-size:13px}
.pacterow .pok{color:var(--mint);font-weight:700}
.pacterow.done .pttl{text-decoration:line-through;color:var(--dim2)}
.objcap+.objcap{margin-top:14px}
.objcaphd{font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;margin:8px 2px 4px}
.objrow2{display:flex;align-items:center;gap:8px;margin-top:8px}
.objttl{flex:1;min-width:0;font-size:14px;font-weight:600;color:var(--txt)}
.objgear{color:var(--dim2);cursor:pointer;font-size:15px;padding:2px 6px;border-radius:7px;flex:none}
.objgear:hover{color:var(--accent-2);background:var(--panel-3)}
.rankrow.mini{gap:5px;margin:5px 0 2px}
.rankrow.mini .rankb{min-width:32px;padding:6px 4px;font-size:12px;border-radius:8px}
.ranklegend{display:flex;flex-wrap:wrap;gap:4px 12px;margin:0 0 12px;font-size:11px;color:var(--dim)}
.ranklegend span{white-space:nowrap;cursor:help}
.ranklegend b{font-family:var(--mono);font-size:11px}
.objrankw{font-family:var(--mono);font-size:10px;letter-spacing:.06em;text-transform:uppercase;flex:none}
.movecaps{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
.movecap{display:grid;justify-items:center;gap:7px;padding:14px 6px;border-radius:12px;cursor:pointer;
  background:var(--panel-3);border:1px solid var(--brd);border-left:3px solid var(--cc);color:var(--dim);
  font-size:11px;font-weight:500;transition:.16s}
.movecap:hover{color:var(--txt);border-color:var(--cc)}
.movecap.on{background:var(--panel-2);border-color:var(--cc);box-shadow:0 0 20px -8px var(--cc);color:var(--txt)}
.movecap .mci{font-size:21px;line-height:1}
.rankrow{display:flex;gap:7px;flex-wrap:wrap}
.rankb{flex:1;min-width:44px;padding:11px 6px;border-radius:11px;cursor:pointer;font-family:var(--mono);
  font-size:15px;font-weight:700;background:var(--panel-3);border:1px solid var(--brd);color:var(--dim2);transition:.16s}
.rankb:hover{color:var(--rc);border-color:var(--rc)}
.rankb.on{color:var(--rc);border-color:var(--rc);background:var(--panel-2);box-shadow:0 0 20px -8px var(--rc)}
.settabs,.stabs,.coachsel{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.settab{padding:10px 16px;border-radius:var(--r-pill);border:1px solid var(--brd);background:var(--panel-3);
  color:var(--dim);font-size:13px;font-weight:500;cursor:pointer;transition:.16s}
.settab.on{color:#fff;border-color:transparent;background:linear-gradient(140deg,var(--accent),var(--accent-deep))}

.spinload{display:inline-block;width:11px;height:11px;border:2px solid rgba(255,255,255,.25);border-top-color:#fff;
  border-radius:50%;animation:spin .7s linear infinite;vertical-align:-1px}
@keyframes spin{to{transform:rotate(360deg)}}

/* ---------- Fenetres, confirmations, notifications ---------- */
#boot.show{background:linear-gradient(135deg,#CBCFEE,#C6DEDB 60%,#C2E3D0)}
.lockwin{text-align:center;max-width:340px}
.lockin{width:100%;text-align:center;font-size:26px;letter-spacing:.5em;padding:14px 10px;margin-top:16px;font-family:var(--mono)}
.lockmsg{font-size:14.5px;color:var(--dim);margin-top:8px}
.lockmsg.err{color:var(--red)}
#modal,#ask,#secret,#boot,#flash{position:fixed;inset:0;z-index:60;display:none;align-items:center;justify-content:center;
  padding:22px;background:rgba(70,44,20,.42);-webkit-backdrop-filter:blur(7px);backdrop-filter:blur(7px)}
#modal.show,#ask.show,#secret.show,#boot.show,#flash.show{display:flex}
.modalwin,.askwin,.secretwin,.bootwin,.flashwin{width:100%;max-width:520px;max-height:86dvh;overflow-y:auto;
  border-radius:var(--r-card);padding:22px;box-shadow:var(--shadow-lg);background:var(--modal-bg)}
.mclose{position:absolute;top:15px;right:17px;cursor:pointer;color:var(--dim2);font-size:17px;padding:3px 7px;border-radius:8px;transition:.14s}

.mbody{margin-top:12px}
.asktitle{font-size:19px;font-weight:600;margin:8px 0 10px}
.asklines{font-size:14px;line-height:1.7;color:var(--dim)}
.askbtns{display:flex;gap:10px;margin-top:18px;flex-wrap:wrap}
#nstack{position:fixed;right:18px;top:18px;z-index:70;display:flex;flex-direction:column;gap:10px;max-width:330px;pointer-events:none}
.ntag{font-family:var(--mono);font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--accent-2)}
.nti{font-size:15px;font-weight:600;margin:5px 0 4px;color:var(--txt)}
.nln{font-family:var(--mono);font-size:11px;color:var(--dim);line-height:1.6}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);z-index:80;padding:12px 22px;border-radius:var(--r-pill);
  background:var(--panel);border:1px solid var(--brd-hi);box-shadow:var(--shadow-lg);font-size:14px;color:var(--txt)}
.fbig{font-size:30px;font-weight:700;letter-spacing:-.01em;color:var(--accent-2)}
.fsub{font-size:14px;color:var(--dim);margin-top:9px}
.fhint{font-family:var(--mono);font-size:10px;color:var(--dim2);margin-top:14px;letter-spacing:.08em}

/* ---------- Quete urgente, journal, sommeil, roue, chat ---------- */
.uquest{border-radius:var(--r-card);padding:18px;border:1px solid rgba(255,80,105,.45);
  background:linear-gradient(150deg,rgba(255,80,105,.14),var(--panel));box-shadow:var(--shadow)}
.uqh{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--pink)}
.uqt{font-size:20px;font-weight:600;margin:9px 0 7px}
.uqmeta,.uqtimer{font-family:var(--mono);font-size:11.5px;color:var(--dim)}
.uqtimer{margin-top:7px;color:var(--gold)}
.jmo{display:flex;gap:10px}
.jentry{padding:14px 0;border-bottom:1px solid var(--track)}
.jh{display:flex;justify-content:space-between;font-family:var(--mono);font-size:10.5px;color:var(--dim2);margin-bottom:7px}
.jn{font-size:13.5px;line-height:1.65;color:var(--dim)}
.sleepbars{display:flex;align-items:flex-end;gap:8px;height:96px;margin:14px 0 6px}
.wheelblock{position:relative}
.wheelwrap{display:grid;place-items:center;gap:16px;padding:4px 0 2px}
.wheel{position:relative;width:min(250px,72vw);aspect-ratio:1;border-radius:50%;display:grid;place-items:center;
  border:2px solid var(--brd-hi);box-shadow:var(--shadow),inset 0 0 0 5px var(--panel-3)}

  filter:drop-shadow(0 0 9px var(--gold))}

.wheelres{text-align:center;min-height:22px;line-height:1.7}
.wheelres .nm{display:block;font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim2)}

.wheelres .btn{margin:0 3px}
.chatbox{display:flex;flex-direction:column;gap:11px;max-height:340px;overflow-y:auto;padding:4px 0}
.bub{max-width:86%;padding:11px 14px;font-size:13.5px;line-height:1.55;border-radius:12px;background:var(--panel-3);border:1px solid var(--brd)}
.bub.me{align-self:flex-end;background:linear-gradient(140deg,rgba(46,52,68,.16),rgba(46,52,68,.08))}
.coachmsg{font-size:14.5px;line-height:1.65;color:var(--txt)}
.epr{font-size:14.5px;line-height:1.7;color:var(--txt)}
.logline{font-family:var(--mono);font-size:11px;color:var(--dim);padding:10px 4px;border-bottom:1px solid var(--track);display:flex;gap:12px}
.logline:last-child{border-bottom:0}
.logline .tm{color:var(--dim2);flex:none}
.propcard{display:flex;align-items:center;gap:12px;padding:14px 16px;border-radius:12px;margin-bottom:9px}

.propcard .meta{margin-top:6px}
.pa{cursor:pointer;font-size:16px;padding:4px 8px;border-radius:8px;flex:none;transition:.14s}

.pa.no{color:var(--pink)}
.pa:hover{background:var(--panel-3)}
.absrow,.sysrow{display:flex;align-items:center;gap:12px;padding:13px 15px;border-radius:12px;font-size:13.5px}
.absst{font-family:var(--mono);font-size:10.5px;color:var(--dim2);margin-left:auto}

.sgrid,.evgrid,.ladder{display:grid;gap:12px}

/* ---------- Ecran d'accueil (il s'affiche a chaque ouverture) ---------- */
.bootwin{text-align:center;max-width:440px}
.bmk{width:82px;height:82px;margin:0 auto 16px;border-radius:24px;display:grid;place-items:center;
  background:linear-gradient(150deg,var(--accent),var(--accent-deep));box-shadow:var(--shadow)}
.bmk svg{width:58px;height:58px}
.bbig{font-size:26px;font-weight:700;letter-spacing:-.01em;color:var(--txt)}
.bsys{font-family:var(--mono);font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--dim2);margin-top:7px}
.bbar{height:5px;border-radius:4px;background:var(--track);overflow:hidden;margin:20px auto 0;max-width:230px}
.bbar i{display:block;height:100%;border-radius:4px;background:linear-gradient(90deg,var(--accent),var(--accent-2));
  transform-origin:left;animation:bload 1.25s cubic-bezier(.3,.8,.3,1) both}
@keyframes bload{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.bstats{display:flex;justify-content:center;gap:18px;margin-top:16px;font-family:var(--mono);font-size:11px;color:var(--dim)}

.benter{margin-top:20px}
.bgreet{font-size:14.5px;line-height:1.6;color:var(--txt);margin:18px auto 0;max-width:380px;
  background:var(--panel);border:1px solid var(--brd);border-radius:var(--r-card);box-shadow:var(--shadow);padding:15px 17px}
.bgreet .who{font-family:var(--mono);font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--dim2);margin-bottom:8px}

/* ---------- Entree secrete ---------- */
.secretwin{text-align:center;max-width:300px}
.secretcore{font-size:56px;color:var(--accent-2);cursor:pointer;user-select:none;animation:corepulse 2.4s ease-in-out infinite}

.secretdots{display:flex;gap:9px;justify-content:center;margin-top:14px}

.secretdots i.on{background:var(--accent-2);box-shadow:0 0 11px var(--accent)}
.secrethint{font-family:var(--mono);font-size:10px;color:var(--dim2);text-align:center;margin-top:11px;letter-spacing:.08em}
.sreset{margin-top:14px;padding:11px 17px;border-radius:var(--r-pill);border:1px solid var(--brd);
  background:var(--panel-3);color:var(--dim);font-size:12px;cursor:pointer}
.rip{position:absolute;border-radius:50%;background:rgba(255,255,255,.5);transform:scale(0);animation:rip .6s ease-out;pointer-events:none}
@keyframes rip{to{transform:scale(2.2);opacity:0}}

/* ---------- Details restants ---------- */
.a-hero,.a-today{animation:viewIn .3s cubic-bezier(.2,.7,.2,1) both}
.todaycols{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.todaycol{min-width:0}
.mcn{line-height:1.25;text-align:center}
.mgroup{margin-bottom:13px}
.mgrouplab{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim2);margin-bottom:7px}
.track{background:var(--track)}
.tsk{font-size:13.5px;color:var(--dim);padding:7px 0}
.mdone{color:var(--mint)}
.sstat{display:flex;justify-content:space-between;gap:11px;font-family:var(--mono);font-size:11px;color:var(--dim);padding:7px 0}
.sttl{font-size:15px;font-weight:600;margin-bottom:9px}
.nt,.nn,.nm{font-family:var(--mono);font-size:10.5px;color:var(--dim)}
.ibtn{cursor:pointer;color:var(--dim2);padding:3px 7px;border-radius:8px;transition:.14s}
.ibtn:hover{color:var(--txt);background:var(--panel-3)}

/* Capacite : les cartes coulent dans des colonnes qui remplissent la largeur,
   quel que soit le contenu (fini la colonne etroite pleine + le large vide). */
.capmason{columns:340px;column-gap:16px}
.capmason>*{break-inside:avoid;margin:0 0 16px}


/* ---------- Notifications (le canal de retour principal) ---------- */
.ncard{background:var(--panel);border:1px solid var(--brd-hi);border-radius:var(--r-md);padding:13px 15px;
  box-shadow:var(--shadow-lg);pointer-events:auto;animation:nIn .28s cubic-bezier(.2,.7,.2,1) both}
.ncard.out{animation:nOut .32s ease forwards}
@keyframes nIn{from{opacity:0;transform:translateX(16px)}to{opacity:1;transform:none}}
@keyframes nOut{to{opacity:0;transform:translateX(16px)}}

/* ---------- Histogramme de sommeil ---------- */
.sleepbars .sb,.sb{flex:1;display:flex;flex-direction:column;align-items:center;gap:5px;height:100%;justify-content:flex-end}
.sbv{flex:1;width:100%;display:flex;align-items:flex-end;justify-content:center;min-height:24px}
.sbv i{display:block;width:60%;border-radius:5px 5px 0 0}
.sbh{font-family:var(--mono);font-size:11px;color:var(--txt)}
.sbl{font-family:var(--mono);font-size:9.5px;color:var(--dim2)}

/* ---------- Boutons de choix (jours d'une journaliere, coach) ---------- */
.cbtn{padding:9px 13px;border-radius:var(--r-sm);border:1px solid var(--brd);background:var(--panel-3);
  color:var(--dim);font-family:var(--font);font-size:13px;font-weight:500;cursor:pointer;transition:.16s}
.cbtn:hover{color:var(--txt);border-color:var(--brd-hi)}
.cbtn.on{color:#fff;border-color:transparent;background:linear-gradient(140deg,var(--accent),var(--accent-deep))}

/* ---------- Humeur du jour : la selection doit se voir ---------- */
.jm{transition:.16s}
.btn.jm.sel{background:linear-gradient(140deg,var(--accent),var(--accent-deep));border-color:transparent;color:#fff;filter:none}

/* =========================================================================
   Points de rupture — 1100 / 1000 / 860 / 700 / 520
   ========================================================================= */
@media(max-width:1200px){
  .dgrid{grid-template-columns:repeat(2,1fr)}

  if(u.qid){var q=find(S.quests,u.qid);if(q&&!q.done){validateTask(q);}}
  var r=gainXP(u.stat,u.xp,"Quête urgente accomplie : "+u.title);
  u.status="done";
  sysNotify("⟪ Système ⟫","Quête urgente accomplie",["+"+u.xp+" XP bonus · "+STATS[u.stat].name,"Le Système reconnaît ta réactivité."]);
  flash("rank","QUÊTE ACCOMPLIE","+"+u.xp+" XP · Le Système est satisfait");
  sfx("success");afterGain(r);save();render();
}
function urgentCountdown(){
  if(!urgentActive())return "";
  var ms=S.urgent.dueTs-Date.now();if(ms<0)ms=0;
  var h=Math.floor(ms/3600000),mn=Math.floor((ms%3600000)/60000);
  return h>=1?(h+"h "+mn+"m"):(mn+"m");
}
function isUrgent(q){return urgentActive()&&S.urgent.qid===q.id&&!q.done;}
function urgentDot(q){
  if(!isUrgent(q))return "";
  return '<span class="udot" title="Imposée par le Système · '+urgentCountdown()+' restantes · +'+S.urgent.xp+' XP bonus"></span>';
}
function urgentBonus(q){ // le bonus tombe quand tu valides la tache elle-meme
  if(!urgentActive()||S.urgent.qid!==q.id)return;
  var u=S.urgent;u.status="done";
  var ck=questCap(q); // et non u.stat, fige a la creation et devine depuis le titre

}

/* ---- Échéances de capacités : atteindre un palier avant une date, au rythme de tes efforts validés ---- */
function capPace(statKey){ // XP/jour moyen récent (jours passés enregistrés)
  var p=S.pace&&S.pace[statKey];if(!p)return null;
  var arr=(p.hist||[]).slice(0,10);if(!arr.length)return null;
  var sum=0;arr.forEach(function(x){sum+=x;});return sum/arr.length;
}
function xpToLevel(cur,curXp,target){var need=0;for(var l=cur;l<target;l++)need+=statNeed(l);return Math.max(0,need-curXp);}
function daysUntil(due){var a=new Date(today()+"T00:00:00Z"),b=new Date(due+"T00:00:00Z");return Math.round((b-a)/86400000);}
function capGoalInfo(statKey){
  var g=S.capGoals&&S.capGoals[statKey];if(!g)return null;
  var lvl=capLevel(statKey),need=Math.max(0,g.target-lvl),days=daysUntil(g.due);
  // Une semaine active = un niveau. La semaine en cours compte si elle n'est pas déjà prise.
  var minDays=need<=0?0:(need-(capTouchedThisWeek(statKey)?0:1))*7;
  var done=need===0,expired=days<0&&!done,verdict,cls;
  if(done){verdict="Palier atteint. Le Système salue ta constance.";cls="ok";}
  else if(expired){verdict="Échéance dépassée. Redéfinis une date.";cls="no";}
  else if(days<minDays){verdict="Impossible : "+need+" semaine"+(need>1?"s":"")+" active"+(need>1?"s":"")+" demandent au moins "+minDays+" jours, tu en as "+days+". Recule l'échéance.";cls="no";}
  else if(days<minDays+7){verdict="Tenable, mais sans droit à l'erreur : toutes les semaines doivent compter.";cls="tight";}
  else{verdict="Large. Il te reste de la marge pour sauter une semaine.";cls="ok";}
  return {g:g,need:need,days:days,minDays:minDays,done:done,expired:expired,verdict:verdict,cls:cls};
}
function capRow(k){
  var m=STATS[k],lvl=capLevel(k),wk=capWeeks(k),p=Math.min(1,wk.length/12);
  var s='<div class="scap"><span class="n">'+m.ic+' '+m.name+'</span><span class="tr"><i style="transform:scaleX('+p+')"></i></span><span class="lv">Lv.'+lvl+'</span><span class="capgo" data-capgoal="'+k+'" title="Fixer une échéance">🎯</span></div>';
  var gi=capGoalInfo(k);
  if(gi){
    s+='<div class="capgoal '+gi.cls+'"><div class="cgl"><span>◈ Objectif : niveau '+gi.g.target+'</span><span>'+(gi.done?'✔ atteint':(gi.expired?'échéance passée':gi.days+' j restants'))+'</span></div>';
    if(!gi.done&&!gi.expired)s+='<div class="cgm">Il te reste <b>'+gi.need+' semaine'+(gi.need>1?'s':'')+' active'+(gi.need>1?'s':'')+'</b> à faire</div>';
    s+='<div class="cgv">'+gi.verdict+'</div></div>';
  }
  return s;
}
var CAPSEL=null; // {stat,target,due}
function openCapGoal(statKey){
  var m=STATS[statKey],g=S.capGoals&&S.capGoals[statKey],lvl=capLevel(statKey),tw=capTouchedThisWeek(statKey);
  if(!CAPSEL||CAPSEL.stat!==statKey){CAPSEL={stat:statKey,target:g?g.target:lvl+1,due:g?g.due:isoPlus(today(),21)};}
  if(CAPSEL.target<=lvl)CAPSEL.target=lvl+1;
  var need=Math.max(0,CAPSEL.target-lvl),days=daysUntil(CAPSEL.due);
  var minDays=need<=0?0:(need-(tw?0:1))*7; // une semaine active = un niveau
  var verdict,cls;
  if(days<=0){verdict="Choisis une date à venir.";cls="no";}
  else if(days<minDays){cls="no";verdict="Impossible : "+need+" semaines actives demandent au moins "+minDays+" jours. Le Système ne compte qu'une semaine par niveau.";}
  else if(days<minDays+7){cls="tight";verdict="Tenable, mais aucune semaine ne peut être sautée.";}
  else{cls="ok";verdict="Large. Tu peux sauter une semaine sans perdre l'échéance.";}
  var h='<div class="mtag">▸ Échéance de capacité</div><div class="mtitle">'+m.ic+' '+m.name+'</div>';
  h+='<div class="subhead" style="margin:6px 0 12px">Niveau actuel : <b style="color:'+m.col+'">Lv.'+lvl+'</b>. Un niveau = <b>une semaine</b> où tu as validé au moins une tâche de cette capacité. Le volume ne compte pas.</div>';
  h+='<div class="subhead" style="margin:0 0 6px">Palier visé</div><div style="display:flex;gap:8px;flex-wrap:wrap">';
  [1,2,3].forEach(function(d){var t=lvl+d;h+='<button class="btn'+(CAPSEL.target===t?"":" ghost")+'" data-captgt="'+t+'">Niveau '+t+'</button>';});
  h+='</div>';
  h+='<div class="subhead" style="margin:14px 0 6px">Avant le</div><div class="addrow"><input type="date" id="capdue" value="'+CAPSEL.due+'" min="'+isoPlus(today(),1)+'" style="max-width:170px"></div>';
  h+='<div class="capprev '+cls+'"><div class="cgm">À faire : <b>'+need+' semaine'+(need>1?'s':'')+' active'+(need>1?'s':'')+'</b> · '+(days>0?days+' jours devant toi':'date invalide')+'</div><div class="cgv">'+verdict+'</div></div>';
  h+='<div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:14px"><button class="btn" id="capset">'+(cls==="no"?"Définir quand même":"Définir l'échéance")+'</button>'+(g?'<button class="btn ghost" id="capdel" style="color:var(--pink)">Retirer</button>':'')+'</div>';
  openModal(h,m.col);
  Array.prototype.forEach.call(document.querySelectorAll("#modal [data-captgt]"),function(el){el.onclick=function(){CAPSEL.target=parseInt(el.dataset.captgt,10);openCapGoal(statKey);};});
  var due=document.getElementById("capdue");if(due)due.onchange=function(){CAPSEL.due=due.value||CAPSEL.due;openCapGoal(statKey);};
  var setb=document.getElementById("capset");if(setb)setb.onclick=function(){
    if(daysUntil(CAPSEL.due)<=0){toast("Choisis une date à venir");return;}
    S.capGoals=S.capGoals||{};S.capGoals[statKey]={target:CAPSEL.target,due:CAPSEL.due,start:{level:lvl,date:today()}};
    save();closeModal();render();toast("Échéance fixée");sysNotify("⟪ Système ⟫","Échéance imposée",[m.name+" · niveau "+CAPSEL.target,"avant le "+CAPSEL.due]);
  };
  var delb=document.getElementById("capdel");if(delb)delb.onclick=function(){if(S.capGoals)delete S.capGoals[statKey];save();closeModal();render();toast("Échéance retirée");};
}

/* notifications */
function sysNotify(tag,title,lines){
  var st=document.getElementById("nstack");if(!st)return;
  var c=document.createElement("div");c.className="ncard";
  c.innerHTML='<div class="nt">▸ '+tag+'</div>'+(title?'<div class="nti">'+title+'</div>':'')+((lines&&lines.length)?'<div class="nln">'+lines.join("  ·  ")+'</div>':'');
  st.appendChild(c);
  setTimeout(function(){c.classList.add("out");setTimeout(function(){if(c.parentNode)c.parentNode.removeChild(c);},350);},3400);
}
var flashT;
function flash(kind,big,sub){
  var el=document.getElementById("flash");if(!el)return;
  var persist=(kind==="level"||kind==="rank"); // montées de niveau/palier : ne disparaît qu'au clic
  el.className="show";
  el.innerHTML='<div class="flashwin '+(kind||"")+'"><div class="fbig">'+big+'</div>'+(sub?'<div class="fsub">'+sub+'</div>':'')+(persist?'<div class="fhint">Touche pour continuer</div>':'')+'</div>';

function momentOf(){var h=gameNow().getUTCHours();if(h>=18||h<5)return "soir";if(h<11)return "matin";return "journee";}

/* ---- Humeur du compagnon, à partir des vraies données ---- */
function companionMood(){
  var m=momentOf();
  if(m==="soir")return "soir";
  var di=dailyInfo();
  if(di.tot>0&&di.done>=di.tot)return "radieux";
  if(di.done>0)return "content";
  if(m==="journee"&&(S.streak||0)===0&&di.done===0)return "attend";
  return "neutre";
}

function warriorLadder(){
  var order=["E","D","C","B","A","S"],names={E:"Recrue",D:"Apprenti",C:"Écuyer",B:"Chevalier",A:"Champion",S:"Élite"};
  var cols={E:"#8aa0b8",D:"#5fd3ac",C:"#34c9ee",B:"#6ea8ff",A:"#a07bff",S:"#ffcf4d"};
  var cur=rankOf(S.hunter.level).r;
  return '<div class="ladder">'+order.map(function(r){
    return '<div class="step'+(r===cur?" cur":"")+'">'+robiAvatar(r,r===cur?"radieux":"content",56,true)+'<div class="rr" style="color:'+cols[r]+'">'+r+'</div><div class="nn">'+names[r]+'</div></div>';
  }).join("")+'</div>';
}

/* ---- Roue de la chance : une tâche libre au hasard ---- */
function isBlocked(q){
  if(q.dependsOn){
    var dep=find(S.quests,q.dependsOn);if(dep)return !dep.done;
    var mis=find(S.missions,q.dependsOn);if(mis){var qs=S.quests.filter(function(x){return x.mission===mis.id&&x.id!==q.id;});return !(qs.length>0&&qs.every(function(x){return x.done;}));}
    return false;
  }
  return !!q.blocked;
}
function depName(q){
  if(!q.dependsOn)return "";
  var dep=find(S.quests,q.dependsOn);if(dep)return dep.title;
  var mis=find(S.missions,q.dependsOn);if(mis)return mis.title+" (objectif)";
  return "";
}
function openDepend(qId){
  var q=find(S.quests,qId);if(!q)return;
  var mis=q.mission?find(S.missions,q.mission):null;
  var sibs=q.mission?S.quests.filter(function(x){return x.mission===q.mission&&x.id!==q.id;}):[];
  var h='<div class="mtag">▸ Dépendance</div><div class="mtitle">'+esc(q.title)+'</div>';
  if(!mis||!sibs.length){h+='<div class="mbody">Cette tâche n\'a pas d\'autre tâche dans son objectif : elle ne peut pas dépendre d\'une autre. Les dépendances se font au sein d\'un même objectif.</div>';openModal(h);return;}
  h+='<div class="subhead" style="margin:6px 0 12px">Dans l\'objectif « '+esc(mis.title)+' », de quoi dépend cette tâche ? Elle restera en attente tant que ce n\'est pas terminé.</div><div style="display:grid;gap:8px">';
  h+='<button class="btn ghost" data-dep="" style="text-align:left">🔗 Aucune, tâche libre'+(!q.dependsOn?" ✓":"")+'</button>';
  h+='<button class="btn ghost" data-dep="'+mis.id+'" style="text-align:left">🎯 Tout le reste de « '+esc(mis.title)+' » terminé'+(q.dependsOn===mis.id?" ✓":"")+'</button>';
  sibs.forEach(function(x){h+='<button class="btn ghost" data-dep="'+x.id+'" style="text-align:left">✓ Après « '+esc(x.title)+' »'+(x.done?" (faite)":"")+(q.dependsOn===x.id?" ✓":"")+'</button>';});
  h+='</div>';
  openModal(h);
  Array.prototype.forEach.call(document.querySelectorAll("#modal [data-dep]"),function(el){el.onclick=function(){q.dependsOn=el.dataset.dep||null;q.blocked=false;save();closeModal();render();};});
}
/* ---- Réglage direct d'une tâche journalière (sans chat) ---- */
/* ---- Réglage d'une tâche : une seule fenêtre pour tout (nom, échéance, répétition, déplacement) ---- */
var TSETCAP=null; // capacité choisie dans la fenêtre, le temps de la manip
function openTaskSet(qId){
  var q=find(S.quests,qId);if(!q)return;
  var multi=isMulti(q),cap=TSETCAP||questCap(q),m=STATS[cap]||STATS.mental;
  var order=[1,2,3,4,5,6,0],lbl={1:"L",2:"M",3:"M",4:"J",5:"V",6:"S",0:"D"};
  var c=q.cad||{},isDays=!!(c.days&&c.days.length),isMonthly=!!c.dom;

  var h='<div class="mtag">▸ Réglages de la tâche</div>';
  // 1. Le nom
  h+='<div class="plab" style="margin-top:12px">Nom</div>';
  h+='<div class="addrow"><input type="text" id="ts-title" maxlength="160" placeholder="Nom de la tâche..."></div>';

  // 2. Répétition : ponctuelle, jours choisis, chaque semaine ou chaque mois
  h+='<div class="plab" style="margin-top:16px">Répétition</div><div style="display:flex;gap:8px;flex-wrap:wrap">';
  h+='<button class="btn'+((!q.daily&&!multi)?"":" ghost")+'" data-tsrep="once">Une seule fois</button>';
  h+='<button class="btn'+(multi?"":" ghost")+'" data-tsrep="days">Jours choisis</button>';
  h+='<button class="btn'+((q.daily&&!isMonthly)?"":" ghost")+'" data-tsrep="weekly">Chaque semaine</button>';
  h+='<button class="btn'+((q.daily&&isMonthly)?"":" ghost")+'" data-tsrep="monthly">Chaque mois</button>';
  h+='</div>';

  // 3. La date, selon le mode choisi
  if(q.daily){
    if(isMonthly){
      h+='<div class="plab" style="margin-top:16px">Quel jour du mois</div>';
      h+='<select id="ts-dom" class="selin" style="max-width:130px">';
      for(var dd=1;dd<=31;dd++)h+='<option value="'+dd+'"'+(c.dom===dd?" selected":"")+'>'+dd+'</option>';
      h+='</select>';
      h+='<div class="subhead" style="margin:8px 0 0">La tâche revient <b>'+cadLabel(q)+'</b> (le dernier jour du mois s\'il est plus court).</div>';
    }else{
      h+='<div class="plab" style="margin-top:16px">Quels jours de la semaine</div><div style="display:flex;gap:6px;flex-wrap:wrap">';
      order.forEach(function(d){var on=isDays?((c.days||[]).indexOf(d)>=0):true;h+='<button class="cbtn'+(on?" on":"")+'" data-tsday="'+d+'" style="min-width:38px;text-align:center">'+lbl[d]+'</button>';});
      h+='</div><div class="subhead" style="margin:8px 0 0">Rythme actuel : <b>'+cadLabel(q)+'</b></div>';
    }
    h+='<div class="plab" style="margin-top:16px">Moment de la journée</div><div style="display:flex;gap:8px;flex-wrap:wrap">';
    h+=momentButtons(q);
    h+='</div>';
    h+='<div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:16px">'+(q.paused?'<button class="btn" data-tspause="0">Réactiver</button>':'<button class="btn ghost" data-tspause="1">Mettre en pause</button>')+'</div>';
  }else if(multi){
    CALSEL={};CALMON=null;CRANGE={from:"",to:""};
    (q.dueDates||[]).forEach(function(d){if(dayDiff(d,today())>=0)CALSEL[d]=true;});
    h+='<div class="plab" style="margin-top:16px">Jours choisis <span style="font-weight:400;color:var(--dim2)">(les jours passés restent acquis)</span></div>';
    h+='<div class="calwrap" id="calbox">'+calHTML()+'</div>';
  }else{
    h+='<div class="plab" style="margin-top:16px">Échéance</div>';
    h+='<div class="addrow"><input type="date" id="ts-due" min="'+today()+'" value="'+(q.due||"")+'" style="max-width:170px"><button class="btn ghost" id="ts-duedel">Retirer</button></div>';
    h+='<div class="plab" style="margin-top:16px">Heure <span style="font-weight:400;color:var(--dim2)">(si c\'est un RDV, facultatif)</span></div>';
    h+='<div class="addrow"><input type="time" id="ts-time" value="'+(q.time||"")+'" style="max-width:130px"><button class="btn ghost" id="ts-timedel">Retirer</button></div>';
  }
  if(!q.daily){ // moment de la journée : range la tâche dans Matin / Midi / Soir du Cockpit
    h+='<div class="plab" style="margin-top:16px">Moment de la journée</div><div style="display:flex;gap:8px;flex-wrap:wrap">';
    h+=momentButtons(q);
    h+='</div>';
  }

  // 3bis. Sous-tâches : uniquement pour les routines (étapes de la routine)
  if(q.daily){
    h+='<div class="plab" style="margin-top:18px">Sous-tâches <span style="font-weight:400;color:var(--dim2)">(étapes de la routine)</span></div>';
    h+='<div class="subhead" style="margin:0 0 8px">La routine se valide toute seule quand toutes ses étapes sont cochées.</div>';
    (q.subs||[]).forEach(function(sub){
      h+='<div class="addrow" style="margin-bottom:6px"><input type="text" class="ts-subttl" data-subid="'+sub.id+'" maxlength="120" value="'+esc(sub.title)+'"><button class="btn ghost" data-tssubdel="'+sub.id+'" style="color:var(--pink);flex:0 0 auto">✕</button></div>';
    });
    h+='<div class="addrow"><input type="text" id="ts-subnew" maxlength="120" placeholder="Ajouter une étape..."><button class="btn ghost" id="ts-subadd" style="flex:0 0 auto">+ Ajouter</button></div>';
  }

  // 4. Déplacer : capacité puis projet
  h+='<div class="plab" style="margin-top:18px">Déplacer</div>';
  h+='<div class="movecaps">';
  Object.keys(STATS).forEach(function(k){var st=STATS[k];h+='<button class="movecap'+(k===cap?" on":"")+'" data-tscap="'+k+'" style="--cc:'+st.col+'"><span class="mci">'+st.ic+'</span><span class="mcn">'+esc(st.name)+'</span></button>';});
  h+='</div>';
  var projs=S.missions.filter(function(x){return capOf(x)===cap;}).sort(byRankDesc);
  h+='<div class="subhead" style="margin:12px 0 6px">Projet · '+m.ic+' '+esc(m.name)+'</div><select id="ts-proj" class="selin" style="max-width:100%;width:100%">';
  h+='<option value=""'+(!q.mission?" selected":"")+'>Sans projet</option>';
  projs.forEach(function(p){h+='<option value="'+p.id+'"'+(q.mission===p.id?" selected":"")+'>'+esc(p.title)+' · rang '+p.rank+'</option>';});
  h+='</select>';

  h+='<div class="rowbtn"><button class="btn" id="ts-save">Enregistrer</button><button class="btn ghost" id="ts-del" style="color:var(--pink)">Supprimer la tâche</button></div>';
  openModal(h,m.col);
  if(multi)bindCal();
  var ti=document.getElementById("ts-title");if(ti){ti.value=q.title;try{ti.focus();ti.setSelectionRange(ti.value.length,ti.value.length);}catch(_){}}

  function reopen(){save();render();openTaskSet(qId);}
  function captureSubs(){if(!q.subs)return;Array.prototype.forEach.call(document.querySelectorAll("#modal .ts-subttl"),function(inp){var sub=find(q.subs,inp.getAttribute("data-subid"));if(sub){var v=(inp.value||"").trim();if(v)sub.title=v.slice(0,120);}});}
  var sadd=document.getElementById("ts-subadd");
  if(sadd)sadd.onclick=function(){var inp=document.getElementById("ts-subnew"),v=(inp&&inp.value||"").trim();if(!v){toast("Écris une étape");return;}captureSubs();if(!q.subs)q.subs=[];q.subs.push({id:uid(),title:v.slice(0,120),done:false});reopen();};
  var sne=document.getElementById("ts-subnew");if(sne)sne.onkeydown=function(e){if(e.key==="Enter"){e.preventDefault();if(sadd)sadd.onclick();}};
  Array.prototype.forEach.call(document.querySelectorAll("#modal [data-tssubdel]"),function(el){el.onclick=function(){captureSubs();var id=el.getAttribute("data-tssubdel");q.subs=(q.subs||[]).filter(function(s){return s.id!==id;});if(!q.subs.length)delete q.subs;reopen();};});
  Array.prototype.forEach.call(document.querySelectorAll("#modal [data-tsrep]"),function(el){el.onclick=function(){
    var mode=el.getAttribute("data-tsrep");
    if(mode==="once"){q.daily=false;delete q.cad;delete q.paused;delete q.dueDates;delete q.doneDates;if(!q.due)q.due=prochaineDate(q.prio);}
    else if(mode==="days"){q.daily=false;delete q.cad;delete q.paused;if(!isMulti(q)){q.dueDates=[q.due||today()];q.doneDates=[];q.due=nextDue(q);}}  // le jour déjà choisi devient le 1er ; on ajoute les autres au calendrier
    else if(mode==="monthly"){q.daily=true;delete q.dueDates;delete q.doneDates;delete q.due;delete q.paused;if(!(q.cad&&q.cad.dom))q.cad={dom:new Date(today()+"T12:00:00Z").getUTCDate()};}  // un jour du mois (aujourd'hui par défaut)
    else{q.daily=true;delete q.dueDates;delete q.doneDates;delete q.due;if(q.cad&&q.cad.dom)q.cad=null;}  // chaque semaine : on efface une éventuelle cadence mensuelle
    q.base=baseFor(q.prio,q.daily);
    reopen();
  };});
  var domSel=document.getElementById("ts-dom");
  if(domSel)domSel.onchange=function(){var v=parseInt(domSel.value,10);if(v>=1&&v<=31){q.cad={dom:v};q.paused=false;save();render();openTaskSet(qId);}};
  Array.prototype.forEach.call(document.querySelectorAll("#modal [data-tsday]"),function(el){el.onclick=function(){
    var d=parseInt(el.getAttribute("data-tsday"),10);
    if(!(q.cad&&q.cad.days))q.cad={days:[1,2,3,4,5,6,0]};        // "tous les jours" devient une liste qu'on peut décocher
    var i=q.cad.days.indexOf(d);if(i>=0)q.cad.days.splice(i,1);else q.cad.days.push(d);
    if(!q.cad.days.length)q.cad=null;                             // plus aucun jour coché : on revient à tous les jours
    q.paused=false;reopen();
  };});
  Array.prototype.forEach.call(document.querySelectorAll("#modal [data-tspause]"),function(el){el.onclick=function(){q.paused=el.getAttribute("data-tspause")==="1";reopen();};});
  Array.prototype.forEach.call(document.querySelectorAll("#modal [data-tsmoment]"),function(el){el.onclick=function(){
    var mo=el.getAttribute("data-tsmoment");
    if(mo==="libre"){delete q.moments;q.moment="libre";}                    // "Peu importe" : exclusif
    else{
      var cur=(q.moments&&q.moments.length)?q.moments.slice():(/^(matin|midi|soir)$/.test(taskMoment(q))?[taskMoment(q)]:[]);
      var i=cur.indexOf(mo);if(i>=0)cur.splice(i,1);else cur.push(mo);      // bascule le moment
      if(!cur.length){delete q.moments;q.moment="libre";}                   // plus rien coché -> Peu importe
      else{var ord={matin:0,midi:1,soir:2};cur.sort(function(a,b){return ord[a]-ord[b];});q.moments=cur;q.moment=cur[0];}
    }
    reopen();
  };});
  Array.prototype.forEach.call(document.querySelectorAll("#modal [data-tscap]"),function(el){el.onclick=function(){TSETCAP=el.getAttribute("data-tscap");openTaskSet(qId);};});
  var dd=document.getElementById("ts-duedel");if(dd)dd.onclick=function(){var e2=document.getElementById("ts-due");if(e2)e2.value="";};
  var td=document.getElementById("ts-timedel");if(td)td.onclick=function(){var e3=document.getElementById("ts-time");if(e3)e3.value="";};
  var del=document.getElementById("ts-del");if(del)del.onclick=function(){
    sysConfirm("Supprimer cette tâche ?",["<b>« "+esc(q.title)+" »</b>","","Elle sera retirée définitivement. Tu ne gagneras aucun XP."],function(){
      S.quests=S.quests.filter(function(x){return x.id!==q.id;});TSETCAP=null;save();closeModal();render();toast("Tâche supprimée");});
  };
  function commit(){
    var v=(document.getElementById("ts-title").value||"").trim();if(!v){toast("Écris un nom");return;}
    q.title=v.slice(0,160);
    if(isMulti(q)){
      var fut=Object.keys(CALSEL).filter(function(x){return CALSEL[x];});
      var past=(q.dueDates||[]).filter(function(d){return dayDiff(d,today())<0;});
      var all=past.concat(fut).filter(function(x,i,a){return a.indexOf(x)===i;}).sort();
      if(all.length>1){q.dueDates=all;q.doneDates=(q.doneDates||[]).filter(function(d){return all.indexOf(d)>=0;});q.due=nextDue(q)||all[all.length-1];}
      else if(all.length===1){q.due=all[0];delete q.dueDates;delete q.doneDates;}
      else{delete q.dueDates;delete q.doneDates;delete q.due;}
    }else if(!q.daily){
      var de=document.getElementById("ts-due");
      if(de){var dv=de.value;
        if(dv&&dv<today()){toast("Cette date est déjà passée. Choisis aujourd'hui ou plus tard.");return;}
        if(dv)q.due=dv;else delete q.due;}
      var te=document.getElementById("ts-time"); // heure du RDV (facultatif)
      if(te){var tv=(te.value||"").trim();if(/^\d{2}:\d{2}$/.test(tv))q.time=tv;else delete q.time;}
    }
    var sel=document.getElementById("ts-proj"),dest=sel?(sel.value||null):null;
    q.mission=dest;
    q.stat=dest?capOf(find(S.missions,dest)):(TSETCAP||q.stat);
    captureSubs();
    TSETCAP=null;save();closeModal();render();toast("Tâche enregistrée");
  }
  var sv=document.getElementById("ts-save");if(sv)sv.onclick=commit;
  if(ti)ti.onkeydown=function(e){if(e.key==="Enter"){e.preventDefault();commit();}};
}
function wheelEligible(){return S.quests.filter(function(q){return !q.daily&&!q.done&&!isBlocked(q)&&!q.pub&&!pubSuppressed(q);});}
function statCol(k){return (STATS[k]&&STATS[k].col)||"#7b5cff";}
/* ---- La roue de nettoyage : elle tire au sort une tache du projet du meme nom ---- */
function roueProjet(){ // le projet "Roue de nettoyage", quel que soit son nom exact
  return S.missions.filter(function(m){return capOf(m)==="discipline"&&/roue|nettoyage|m[eé]nage/i.test(m.title);})[0]||null;
}
function roueTaches(){
  var p=roueProjet();if(!p)return [];
  return S.quests.filter(function(q){return q.mission===p.id&&!q.done&&!isBlocked(q)&&!q.pub;}).slice(0,10);
}
function roueCard(){
  var p=roueProjet();if(!p)return "";
  var t=roueTaches(),n=t.length;
  var s='<div class="spanel wheelblock"><div class="spl">🎡 '+esc(p.title)+'</div>';
  if(!n){
    s+='<div class="empty">Aucune tâche à tirer. Ajoute ce que tu veux voir revenir : sol, poussière, vitres, draps, salle de bain...</div></div>';
    return s;
  }
  s+='<div class="subhead" style="margin:0 0 12px">Tu ne sais pas par quoi commencer ? Laisse la roue décider.</div>';
  s+='<div class="wheelwrap"><div class="wheel"><span class="ptr"></span><svg class="disc" id="roue-disc" viewBox="0 0 200 200">';
  var COLS=["#FF8A4D","#FFCF4D","#3FE6A3","#3AC2FF","#9A6CFF","#FF6FC7","#FFA94D","#6EE7B7","#7DD3FC","#C4B5FD"];
  if(n===1){
    s+='<circle cx="100" cy="100" r="94" fill="'+COLS[0]+'" opacity=".8"/>';
    s+='<text x="100" y="46" text-anchor="middle" fill="#0a0f1e" font-size="11" font-weight="700">'+esc(coupe(t[0].title,16))+'</text>';
  }else{
    var seg=360/n;
    for(var i=0;i<n;i++){
      var a0=(-90+i*seg)*Math.PI/180,a1=(-90+(i+1)*seg)*Math.PI/180;
      var x0=100+94*Math.cos(a0),y0=100+94*Math.sin(a0),x1=100+94*Math.cos(a1),y1=100+94*Math.sin(a1);
      var lg=seg>180?1:0;
      s+='<path d="M100 100 L'+x0.toFixed(1)+' '+y0.toFixed(1)+' A94 94 0 '+lg+' 1 '+x1.toFixed(1)+' '+y1.toFixed(1)+' Z" fill="'+COLS[i%COLS.length]+'" opacity=".82" stroke="rgba(10,15,30,.35)" stroke-width="1.2"/>';
      // Le libelle suit le rayon, tete vers l'exterieur, pour rester lisible
      var mid=-90+i*seg+seg/2;
      s+='<text transform="rotate('+mid.toFixed(1)+' 100 100)" x="100" y="100" fill="#0a0f1e" font-size="'+(n>7?8:9.5)+'" font-weight="700" text-anchor="end" dominant-baseline="middle">'+
         '<tspan x="184" dy="0" transform="rotate(90 184 100)">'+esc(coupe(t[i].title,n>7?12:15))+'</tspan></text>';
    }
  }
  s+='</svg><span class="hub">🧽</span></div>';
  s+='<button class="btn" id="roue-spin">Tourner la roue</button>';
  s+='<div class="wheelres" id="roue-res"></div></div></div>';
  return s;
}
function coupe(t,n){t=String(t);return t.length>n?t.slice(0,n-1)+"…":t;}
function wireRoue(){
  var btn=document.getElementById("roue-spin");if(!btn)return;
  btn.onclick=function(){
    var t=roueTaches(),n=t.length;if(!n)return;
    var disc=document.getElementById("roue-disc"),res=document.getElementById("roue-res");
    if(!disc)return;
    var idx=Math.floor(Math.random()*n),seg=360/n;
    var base=disc._rot||0,target=base+360*5+(360-(idx*seg+seg/2));
    disc._rot=target;disc.style.transform="rotate("+target+"deg)";
    btn.disabled=true;
    if(res)res.innerHTML='<span class="nm">La roue tourne...</span>';
    sfx("check");
    setTimeout(function(){
      btn.disabled=false;
      var q=t[idx];if(!q||!res)return;
      res.innerHTML='<span class="nm">La roue a choisi</span><span class="tsk">« '+esc(q.title)+' »</span>'+
        '<button class="btn" id="roue-do">C\'est fait</button> <button class="btn ghost" id="roue-again">Retourner</button>';
      sfx("success");
      var d=document.getElementById("roue-do");
      if(d)d.onclick=function(){
        sysConfirm("Tu as fait ce ménage ?",["<b>« "+esc(q.title)+" »</b>","","Le Système ne récompense que le réel."],
          function(){var qq=find(S.quests,q.id);if(qq&&!qq.done){validateTask(qq);}render();});
      };
      var ag=document.getElementById("roue-again");
      if(ag)ag.onclick=function(){btn.onclick();};
    },3700);
  };
}

function wheelCard(){
  var elig=wheelEligible(),n=Math.min(8,elig.length);
  if(n===0)return '<div class="wheelblock"><div class="plab">Roue de la chance</div><div class="empty">Aucune tâche libre pour l\'instant. Ajoute-en une, ou ouvre le cadenas d\'une tâche.</div></div>';
  var svg;

function weekdayMon(iso){return (new Date(iso+"T12:00:00Z").getUTCDay()+6)%7;}             // lundi=0 ... dimanche=6
function fmtDJ(ds){return ["lun","mar","mer","jeu","ven","sam","dim"][weekdayMon(ds)]+" "+fmtD(ds);}

/* ---- Planning de publication (par objectif) : tâche 4 jours avant la date, reste jusqu'à validation, et met en retrait les autres tâches de l'objectif ---- */
function makePubQuest(m,d){return {id:"pub_"+m.id+"_"+d,pub:true,pubDate:d,mission:m.id,title:"Publier « "+m.title+" » du "+fmtD(d),stat:"business",prio:"high",base:40,done:false};}
function pubEligibleDate(m){ // la date la plus proche non publiée dont la fenêtre (J-4) a commencé
  if(!m.pubDates||!m.pubDates.length)return null;
  var t=today(),elig=m.pubDates.filter(function(d){return t>=isoPlus(d,-4);}).slice().sort();
  return elig.length?elig[0]:null;
}
function pubTick(){ // synchronise les tâches de publication avec les dates planifiées (une seule active par objectif)
  var changed=false;
  (S.missions||[]).forEach(function(m){
    // 1) toute publication déjà validée : on retire sa date du planning (elle est publiée)
    S.quests.forEach(function(q){if(q.pub&&q.mission===m.id&&q.done&&m.pubDates){var n=m.pubDates.length;m.pubDates=m.pubDates.filter(function(d){return d!==q.pubDate;});if(m.pubDates.length!==n)changed=true;}});
    var keep=pubEligibleDate(m);
    // 2) on retire les tâches de publication validées OU obsolètes (une seule active à la fois)
    S.quests=S.quests.filter(function(q){if(q.pub&&q.mission===m.id&&(q.done||q.pubDate!==keep)){changed=true;return false;}return true;});
    if(keep&&!S.quests.some(function(q){return q.pub&&q.mission===m.id&&q.pubDate===keep;})){S.quests.push(makePubQuest(m,keep));changed=true;}
  });
  if(changed)save();
}

function pmStash(){ // garde ce qui est tapé quand on recharge la fenêtre
  var t=document.getElementById("pm-title"),n=document.getElementById("pm-note"),h=document.getElementById("pm-theme");

function deleteProject(mId){
  var m=find(S.missions,mId);if(!m)return;
  var cap=capOf(m),titre=m.title;
  // Les tâches de publication n'ont plus d'objet sans leur projet
  S.quests=S.quests.filter(function(q){return !(q.pub&&q.mission===mId);});
  // Les autres sont conservées, rattachées à la capacité du projet supprimé
  var n=0;S.quests.forEach(function(q){if(q.mission===mId){q.mission=null;q.stat=cap;n++;}});
  // Une dépendance qui pointait sur ce projet, ou sur une de ses tâches supprimées, n'a plus de sens
  var vivantes={};S.quests.forEach(function(x){vivantes[x.id]=1;});
  S.quests.forEach(function(q){
    if(!q.dependsOn)return;
    if(q.dependsOn===mId||(!vivantes[q.dependsOn]&&!find(S.missions,q.dependsOn)))delete q.dependsOn;
  });
  S.missions=S.missions.filter(function(x){return x.id!==mId;});
  if(objSel===mId)objSel=null;
  delete projOpen[mId];delete taskCollapse[mId];
  if(S.urgent&&S.urgent.mission===mId)S.urgent.mission=null;
  // Sans tâche à cocher, la quête urgente serait impossible à accomplir et coûterait sa pénalité
  if(S.urgent&&S.urgent.status==="active"&&(!S.urgent.qid||!find(S.quests,S.urgent.qid))){
    S.urgent.status="cancelled";S.urgentNext=isoPlus(today(),1);
  }
  PROJSEL=null;save();closeModal();
  log("Projet supprimé : "+titre);
  sysNotify("Projet supprimé",esc(titre),[n?(n+" tâche"+(n>1?"s":"")+" conservée"+(n>1?"s":"")+" dans "+STATS[cap].name):"Aucune tâche à conserver"]);
  render();
}

function addCapTask(forced){
  var el=document.getElementById("q-title");var t=el?el.value.trim():"";if(!t)return false;
  var c=classifyQuest(t);var sel=document.getElementById("q-obj");var ov=sel?sel.value:"__auto";
  var mission=(ov==="__auto")?c.mission:(ov&&find(S.missions,ov)?ov:null);
  var st=(forced&&STATS[forced])?forced:c.stat;
  var dates=Object.keys(CALSEL||{}).filter(function(x){return CALSEL[x];}).sort();
  var daily=c.daily&&dates.length===0;   // des jours choisis priment sur "journalière"
  var q={id:uid(),title:t,stat:st,daily:daily,prio:c.prio,base:baseFor(c.prio,daily),done:false,mission:mission};
  if(dates.length>1){q.dueDates=dates;q.doneDates=[];q.due=nextDue(q);}
  else if(dates.length===1){q.due=dates[0];}
  else if(!daily){q.due=prochaineDate(q.prio);}
  S.quests.push(q);save();
  var mn=q.mission?((find(S.missions,q.mission)||{}).title||"Aucun objectif"):"Aucun objectif";
  var quand=dates.length>1?(dates.length+" jours choisis"):(dates.length===1?("le "+fmtD(dates[0])):(daily?"Journalière":"Priorité "+q.prio));
  sysNotify("Tâche classée",esc(t),[STATS[q.stat].name+" · "+quand+" · +"+q.base+" XP","Objectif : "+mn]);
  render();return true;
}
function addCapProject(forced){
  var el=document.getElementById("m-title");var t=el?el.value.trim():"";if(!t)return null;
  var thEl=document.getElementById("m-theme");var th=thEl?thEl.value.trim():"";  // thème : nouveau ou existant

  S.missions.push({id:id,title:t,rank:rk,note:"",stat:(forced&&STATS[forced])?forced:guessProjStat(t),theme:th});save();
  sysNotify("Projet créé",esc(t),[th?("Thème : "+th):"Sans thème","Rang attribué : "+rk]);
  render();return id;
}
var MOIS=["janvier","février","mars","avril","mai","juin","juillet","août","septembre","octobre","novembre","décembre"];
function calHTML(){
  var anchor=CALMON||firstOfMonth(today());
  var y=+anchor.slice(0,4),M=+anchor.slice(5,7);           // M sur 1-12
  var dim=daysInMonth(y,M),lead=weekdayMon(ymd(y,M,1)),td=today();

  h+='<div class="calgrid">';
  ["L","M","M","J","V","S","D"].forEach(function(w){h+='<span class="caldow">'+w+'</span>';});
  for(var i=0;i<lead;i++)h+='<span class="cald empty"></span>';
  for(var d=1;d<=dim;d++){
    var iso=ymd(y,M,d),past=dayDiff(iso,td)<0,sel=!!CALSEL[iso],isT=iso===td;
    h+='<button type="button" class="cald'+(sel?" on":"")+(isT?" tod":"")+(past?" past":"")+'"'+(past?" disabled":' data-calday="'+iso+'"')+'>'+d+'</button>';
  }
  h+='</div>';
  var chosen=Object.keys(CALSEL).filter(function(x){return CALSEL[x];}).sort();
  h+='<div class="calrange"><span class="crl">Une période d\'un coup :</span><input type="date" class="cr-from" min="'+td+'" value="'+CRANGE.from+'"><span class="cra">→</span><input type="date" class="cr-to" min="'+td+'" value="'+CRANGE.to+'"><button type="button" class="btn ghost cr-add">Ajouter</button></div>';
  h+='<div class="calsum">'+(chosen.length?('<b>'+chosen.length+'</b> jour'+(chosen.length>1?"s":"")+" choisi"+(chosen.length>1?"s":"")+" · "+chosen.map(fmtD).join(", ")):"Aucun jour : la tâche sera datée automatiquement.")+'</div>';
  return h;
}
function bindCal(){
  var box=document.getElementById("calbox");if(!box)return;
  function redraw(){box.innerHTML=calHTML();bindCal();}
  Array.prototype.forEach.call(box.querySelectorAll("[data-calday]"),function(el){el.onclick=function(){var d=el.getAttribute("data-calday");if(CALSEL[d])delete CALSEL[d];else CALSEL[d]=true;redraw();};});
  var pv=box.querySelector("[data-calnav='prev']"),nx=box.querySelector("[data-calnav='next']");
  if(pv)pv.onclick=function(){CALMON=addMonth(CALMON||firstOfMonth(today()),-1);redraw();};
  if(nx)nx.onclick=function(){CALMON=addMonth(CALMON||firstOfMonth(today()),1);redraw();};
  // sélection d'une période entière (ex. une JDC qui dure une semaine) : du... au...
  var rf=box.querySelector(".cr-from"),rt=box.querySelector(".cr-to"),ra=box.querySelector(".cr-add");
  if(rf)rf.oninput=function(){CRANGE.from=rf.value;};
  if(rt)rt.oninput=function(){CRANGE.to=rt.value;};
  if(ra)ra.onclick=function(){
    var a=CRANGE.from,b=CRANGE.to;if(!a||!b){toast("Choisis un début et une fin");return;}
    if(a>b){var tmp=a;a=b;b=tmp;}
    var d=(a<today())?today():a,guard=0;
    while(d<=b&&guard<370){CALSEL[d]=true;d=isoPlus(d,1);guard++;}
    CRANGE={from:"",to:""};redraw();
  };
}

var chatBusy=false;

function openManage(id){var q=find(S.quests,id);if(!q)return;closeModal();manageId=id;view="maitre";render();

function applyDailyEdit(){
  if(chatBusy||!manageId)return;
  var q=find(S.quests,manageId);if(!q){manageId=null;render();return;}
  var recent=(S.chat||[]).slice(-8).map(function(mm){return (mm.role==="user"?"Moi: ":"ROBI: ")+mm.content;}).join("\n");
  toast("ROBI ajuste...");
  gm("edit_daily",{description:recent,quest:{id:q.id,title:q.title,cad:q.cad||null,paused:!!q.paused}}).then(function(r){
    if(!r||!r.op||r.op==="none"){pushChat("assistant","Je n'ai pas saisi le changement. Précise (ex : « tous les 2 jours », « lundi mercredi vendredi », « pause », « retire-la »).");renderChat();return;}
    var msg="";
    if(r.op==="cadence_everyN"){var n=Math.max(1,r.everyN||1);q.cad={n:n,anchor:today()};q.paused=false;msg=n<=1?"« "+q.title+" » revient chaque jour.":"« "+q.title+" » : désormais tous les "+n+" jours.";}
    else if(r.op==="cadence_weekdays"){var days=(r.weekdays||[]).filter(function(d){return d>=0&&d<=6;});if(!days.length){pushChat("assistant","Quels jours précisément ?");renderChat();return;}q.cad={days:days};q.paused=false;msg="« "+q.title+" » : désormais "+cadLabel(q)+".";}
    else if(r.op==="pause"){q.paused=true;msg="« "+q.title+" » mise en pause. Elle ne compte plus dans les journalières.";}

  }).catch(function(){toast("Erreur réseau");});

    e.chat.push({role:"assistant",content:reply});if(e.chat.length>20)e.chat=e.chat.slice(-20);save();renderConvo(kind,id);
  }).catch(function(){convoBusy=false;e.chat.push({role:"assistant",content:"(Connexion impossible, réessaie.)"});save();renderConvo(kind,id);});

function urgencyRank(){ // tâches actionnables à prioriser : retards, puis aujourd'hui, puis prioritaires sans date ; à urgence égale, l'objectif le plus important d'abord
  var pool=S.quests.filter(function(q){
    if(q.daily||doneForToday(q)||isBlocked(q)||q.pub||pubSuppressed(q))return false;
    if(q.due)return dayDiff(q.due,today())<=0;
    return q.prio==="high";
  });
  function key(q){var d=q.due?dayDiff(q.due,today()):50;var bucket=d<0?0:(d===0?1:2);var prio={high:0,med:1,low:2}[q.prio||"med"];return bucket*10000+prio*1000+objWeight(q)*100+Math.min(60,Math.max(0,d<0?0:d));}

}

function prioPool(){ // tâches actives (hors journalières/faites/bloquées/publications), triées par rang d'objectif puis échéance
  var pool=S.quests.filter(function(q){return !q.daily&&!q.done&&!isBlocked(q)&&!q.pub&&!pubSuppressed(q);});
  return pool.sort(function(a,b){
    var wa=objWeight(a),wb=objWeight(b);if(wa!==wb)return wa-wb;                 // objectif le plus vital d'abord
    var da=a.due||"9999-99-99",db=b.due||"9999-99-99";if(da!==db)return da<db?-1:1; // puis échéance la plus proche

function questTree(list,ctx){

function objSendPoint(){
  if(OBJBUSY||!objSel)return;var m=find(S.missions,objSel);if(!m)return;
  var el=document.getElementById("obj-point");var pt=el?el.value.trim():"";
  if(!pt){toast("Écris ton point d'abord");return;}

  gm("weekly_review",{dungeons:[{id:m.id,title:m.title,note:m.note||"",rank:m.rank}],description:pt}).then(function(res){
    OBJBUSY=false;
    if(res&&res.error){render();toast("⚠ ROBI : "+res.error);return;} // on montre la vraie erreur au lieu de la masquer
    var qs=(res&&res.quests)||[];
    m.proposals=qs.slice(0,6).map(function(x){return {title:String(x.title||"").slice(0,160),stat:STATS[x.stat]?x.stat:"discipline",prio:["high","med","low"].indexOf(x.prio)>=0?x.prio:"med"};}).filter(function(p){return p.title;});

function objAcceptProp(i){

function objRefuseProp(i){var m=find(S.missions,objSel);if(!m||!m.proposals)return;m.proposals.splice(i,1);save();render();}

function sleepToday(){var l=(S.sleepLog||[]).filter(function(x){return x.date===today();})[0];return l?l.h:null;}
function sleepAvg(n){var a=(S.sleepLog||[]).slice(0,n);if(!a.length)return null;var t=0;a.forEach(function(x){t+=x.h;});return t/a.length;}
function setSleep(h){
  S.sleepLog=S.sleepLog||[];
  var i=-1;for(var k=0;k<S.sleepLog.length;k++){if(S.sleepLog[k].date===today()){i=k;break;}}
  var first=(i<0);
  if(i>=0)S.sleepLog[i].h=h;else S.sleepLog.unshift({date:today(),h:h});
  if(S.sleepLog.length>60)S.sleepLog.length=60;
  save();
  if(first){var r=gainXP("physique",5,"Sommeil noté ("+h+" h)");sysNotify("Sommeil",h+" h notées",["+5 XP · "+STATS.physique.name]);afterGain(r);}
  else toast("Sommeil mis à jour");
  render();
}

function habActiveToday(){var ds=today();var dl=S.quests.filter(function(q){return q.daily&&dueOn(q,ds);});return dl.some(function(q){return q.done;});}
function habHistMap(){var m={};(S.history||[]).forEach(function(e){m[e.date]=e;});return m;}
function habDayActive(d,map){if(d===today())return habActiveToday();var e=map[d];return !!(e&&((e.done>0)||(e.doneIds&&e.doneIds.length>0)));}
function habWeekActive(){var mon=isoPlus(today(),-weekdayMon(today()));var map=habHistMap();var n=0;for(var i=0;i<7;i++){var d=isoPlus(mon,i);if(d>today())break;if(habDayActive(d,map))n++;}return n;}
function habFrise(){var map=habHistMap();var out="";for(var i=29;i>=0;i--){var d=isoPlus(today(),-i);var known=(map[d]!=null)||(d===today());var a=habDayActive(d,map);var col=a?"#5fe0aa":(known?"rgba(150,190,240,.16)":"rgba(150,190,240,.06)");out+='<span title="'+d+'" style="width:13px;height:13px;border-radius:3px;background:'+col+';display:inline-block"></span>';}return out;}
function habRate(q){var due=0,done=0;(S.history||[]).forEach(function(e){if(e.dueIds&&e.dueIds.indexOf(q.id)>=0){due++;if(e.doneIds&&e.doneIds.indexOf(q.id)>=0)done++;}});if(dueToday(q)){due++;if(q.done)done++;}return due?Math.round(done/due*100):null;}
function habDashboard(){

  s+='<div class="subhead" style="margin-top:6px">Chaque case verte = un jour où tu as fait au moins une habitude.</div>';
  s+='<div class="plab" style="margin-top:14px">Par habitude</div>';
  if(!dailies.length)s+='<div class="empty">Aucune habitude pour l\'instant.</div>';
  else{s+='<div class="sys">';dailies.forEach(function(q){var r=habRate(q);var done=dueToday(q)&&q.done;var pf=(r==null?0:r/100);s+='<div class="sysrow"><span class="n">'+(done?"✓ ":"")+esc(q.title)+'</span><span class="track"><i style="transform:scaleX('+pf+');background:linear-gradient(90deg,#5fe0aa88,#5fe0aa)"></i></span><span class="p">'+(r==null?"—":r+"%")+'</span></div>';});s+='</div>';}
  s+='<div class="subhead" style="margin-top:6px">Le taux par habitude se remplit à partir de maintenant.</div>';
  s+='</div>';

  });

}

/* ---- Écran d'accueil de ROBI (ouverture façon Iron Man / JARVIS) ---- */
var BOOT_GREETS=["À votre service, quand vous le souhaitez.","Tout est prêt, je vous laisse commencer.","Je reste à votre entière disposition.","Prenez votre temps, je m'occupe du reste."];
var bootTimer=null;
/* ---- Code d'accès (verrou de confidentialité, local à l'appareil) ---- */
var BOOT_UNLOCKED=false;
function robiPass(){try{return localStorage.getItem("robi_pass")||"";}catch(e){return "";}}
function setRobiPass(hx){try{if(hx)localStorage.setItem("robi_pass",hx);else localStorage.removeItem("robi_pass");}catch(e){}}
function hashPass(code){
  code=String(code||"");
  try{
    if(window.crypto&&crypto.subtle&&crypto.subtle.digest&&window.TextEncoder){
      var data=new TextEncoder().encode("robi:"+code);
      return crypto.subtle.digest("SHA-256",data).then(function(buf){
        return Array.prototype.map.call(new Uint8Array(buf),function(b){return b.toString(16).padStart(2,"0");}).join("");
      });
    }
  }catch(e){}
  var h=5381;for(var i=0;i<code.length;i++)h=((h<<5)+h+code.charCodeAt(i))>>>0; // repli si SubtleCrypto indisponible
  return Promise.resolve("s"+h.toString(16));
}
function showBoot(){
  var el=document.getElementById("boot");if(!el)return;
  applyTheme();
  var pass=robiPass();
  // Plus de message de bonjour : sans code on entre directement, avec code on demande le code.
  if(!pass||BOOT_UNLOCKED){el.className="";el.innerHTML="";return;}
  el.innerHTML='<div class="bootwin lockwin">'+
    '<div class="bmk">'+robiAvatar(rankOf(S.hunter.level).r,"neutre",60)+'</div>'+
    '<div class="bsys">ROBI</div>'+
    '<div class="lockmsg" id="lock-msg">Entre ton code d\'accès</div>'+
    '<input type="password" inputmode="numeric" id="lock-in" class="lockin" autocomplete="off" placeholder="••••">'+
    '<button class="btn" id="lock-go" style="width:100%;margin-top:14px">Déverrouiller</button>'+
  '</div>';
  el.className="show";
  var inp=document.getElementById("lock-in");if(inp){try{inp.focus();}catch(e){}}
  function tryUnlock(){
    var v=(document.getElementById("lock-in")||{}).value||"";
    hashPass(v).then(function(hx){
      if(hx===robiPass()){BOOT_UNLOCKED=true;el.className="";el.innerHTML="";}
      else{var mm=document.getElementById("lock-msg");if(mm){mm.textContent="Code incorrect. Réessaie.";mm.className="lockmsg err";}var i2=document.getElementById("lock-in");if(i2){i2.value="";try{i2.focus();}catch(e){}}sfx("penalty");}
    });
  }
  var go=document.getElementById("lock-go");if(go)go.onclick=tryUnlock;
  if(inp)inp.onkeydown=function(e){if(e.key==="Enter")tryUnlock();};
}
function afterSync(){

  loadFeed();ingestTasks();loadCitation();
}
